<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tattoo Trace Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">TT</div>
        <div>
          <strong>Tattoo Trace</strong>
          <span>Studio</span>
        </div>
      </div>

      <label class="upload-button" for="imageInput" title="Escolher desenho">
        <span class="upload-icon">＋</span>
        <span>Adicionar desenho</span>
      </label>
      <input id="imageInput" type="file" accept="image/*" hidden>
    </header>

    <section class="workspace" id="workspace">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⌁</div>
        <h1>Coloque seu desenho aqui</h1>
        <p>Envie uma foto ou imagem do stencil para ajustar a escala e travar a tela.</p>
        <label class="primary-button" for="imageInput">Escolher imagem</label>
      </div>

      <div class="image-stage hidden" id="imageStage">
        <img id="traceImage" alt="Desenho para decalque">
      </div>

      <div class="lock-shield hidden" id="lockShield" aria-hidden="true"></div>

      <button class="lock-button" id="lockButton" type="button" title="Travar desenho" aria-label="Travar desenho">
        <span id="lockIcon">🔓</span>
      </button>

      <div class="locked-indicator hidden" id="lockedIndicator">
        <span class="indicator-dot"></span>
        TELA TRAVADA
      </div>
    </section>

    <section class="controls" id="controls">
      <div class="control-row">
        <button class="tool-button" id="resetButton" type="button">↺ <span>Redefinir</span></button>

        <div class="zoom-control">
          <button id="zoomOut" type="button" aria-label="Diminuir desenho">−</button>
          <input id="zoomSlider" type="range" min="25" max="300" value="100" step="1" aria-label="Escala do desenho">
          <button id="zoomIn" type="button" aria-label="Aumentar desenho">＋</button>
          <output id="zoomValue">100%</output>
        </div>

        <button class="tool-button" id="fitButton" type="button">⛶ <span>Ajustar</span></button>
      </div>

      <p class="hint" id="hint">
        Ajuste o tamanho do desenho. Depois toque no cadeado para impedir que o toque da caneta mova a imagem.
      </p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
